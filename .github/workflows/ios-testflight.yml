name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify iOS release source and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Apple signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID" || { echo "Missing required GitHub Actions secret: APPLE_TEAM_ID" >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo "Missing required GitHub Actions secret: APP_STORE_CONNECT_KEY_ID" >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo "Missing required GitHub Actions secret: APP_STORE_CONNECT_ISSUER_ID" >&2; exit 1; }
          test -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" || { echo "Missing required GitHub Actions secret: APP_STORE_CONNECT_API_KEY_P8_BASE64" >&2; exit 1; }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build-and-upload:
    needs: verify
    name: Build and upload iOS
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TV: "0"
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select Xcode 26.5
        run: sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"

      - run: pnpm install --frozen-lockfile

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate native iOS project
        run: pnpm --filter @moviestv/mobile-tv exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile-tv/ios
        run: pod install --repo-update

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
            > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          test -s "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Discover Xcode workspace and scheme
        shell: bash
        run: |
          set -euo pipefail
          IOS_DIR="apps/mobile-tv/ios"
          WORKSPACE="$(find "$IOS_DIR" -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace found in $IOS_DIR" >&2
            exit 1
          fi
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace",{}).get("schemes",[]); app=next((s for s in schemes if not s.startswith("Pods-")), ""); print(app)')"
          if [ -z "$SCHEME" ]; then
            echo "No shared Xcode scheme found" >&2
            exit 1
          fi
          echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "IOS_ARCHIVE_PATH=$RUNNER_TEMP/MoviesTv-Flix.xcarchive" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        shell: bash
        run: |
          set -euo pipefail
          export EXPO_PUBLIC_BUILD_SHA="$(git rev-parse --short=12 HEAD)"
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$IOS_ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            MARKETING_VERSION="1.0.0" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath artifacts/ios \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$(find artifacts/ios -maxdepth 1 -name '*.ipa' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: MoviesTv-Flix-iOS-TestFlight-${{ github.run_number }}
          path: artifacts/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/UploadOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/testflight-upload" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
