name: Cloudflare Pages deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TV: "0"
      EXPO_PUBLIC_PREVIEW_MODE: "1"
      NODE_VERSION: "22"
      PNPM_VERSION: "11.25.0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "Missing repository secret CLOUDFLARE_API_TOKEN" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          }

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pwa

      - name: Deploy current main to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy apps/mobile-tv/dist
            --project-name=moviestv-flix
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message="MoviesTv-Flix production deploy"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed updater route
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl -fsS             -H 'Cache-Control: no-cache'             "https://main.moviestv-flix.pages.dev/api/app-update/manifest?deploy=${GITHUB_SHA}")"
          node -e '
            const manifest = JSON.parse(process.argv[1]);
            if (manifest.schemaVersion !== 1 || manifest.channel !== "preview") {
              throw new Error("Deployed update manifest is invalid");
            }
          ' "$manifest"
