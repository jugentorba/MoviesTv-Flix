  ios-resignable-preview:
    name: iOS re-signable preview IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: 26.5
      cocoapods: default
      vars:
        EXPO_TV: "0"
        EXPO_PUBLIC_PREVIEW_MODE: "1"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Enable pnpm
        script: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Install dependencies
        script: pnpm install --frozen-lockfile

      - name: Verify source
        script: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Generate iOS project
        script: pnpm --filter @moviestv/mobile-tv exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: |
          cd apps/mobile-tv/ios
          pod install

      - name: Build unsigned device app
        script: |
          set -euo pipefail
          export NODE_ENV=production
          export EXPO_PUBLIC_BUILD_SHA="$(git rev-parse --short=12 HEAD)"
          IOS_DIR="$CM_BUILD_DIR/apps/mobile-tv/ios"
          WORKSPACE="$(find "$IOS_DIR" -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"

          PROJECT="$(find "$IOS_DIR" -maxdepth 1 -type d -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME_FILE="$(find "$PROJECT/xcshareddata/xcschemes" -maxdepth 1 -type f -name '*.xcscheme' -print -quit)"
          test -n "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          test -n "$SCHEME"

          DERIVED="$CM_BUILD_DIR/artifacts/ios-derived"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

          APP="$(find "$DERIVED/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          mkdir -p artifacts/ios
          bash scripts/package-ios-resignable.sh "$APP" artifacts/ios/MoviesTv-Flix-ios-resignable-preview.ipa
          bash scripts/verify-ios-resignable.sh \
            artifacts/ios/MoviesTv-Flix-ios-resignable-preview.ipa \
            "$(git rev-parse --short=12 HEAD)"
          (
            cd artifacts/ios
            shasum -a 256 MoviesTv-Flix-ios-resignable-preview.ipa > MoviesTv-Flix-ios-resignable-preview.ipa.sha256
          )

    artifacts:
      - artifacts/ios/MoviesTv-Flix-ios-resignable-preview.ipa
      - artifacts/ios/MoviesTv-Flix-ios-resignable-preview.ipa.sha256
      - /tmp/xcodebuild_logs/*.log

  tvos-resignable-preview:
    name: tvOS re-signable preview IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: 26.5
      cocoapods: default
      vars:
        EXPO_TV: "1"
        EXPO_PUBLIC_PREVIEW_MODE: "1"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Enable pnpm
        script: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm config set store-dir "$HOME/.pnpm-store"

      - name: Install dependencies
        script: pnpm install --frozen-lockfile

      - name: Verify source
        script: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Generate tvOS project
        script: pnpm --filter @moviestv/mobile-tv exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: |
          cd apps/mobile-tv/ios
          pod install

      - name: Build unsigned Apple TV app
        script: |
          set -euo pipefail
          export NODE_ENV=production
          export EXPO_PUBLIC_BUILD_SHA="$(git rev-parse --short=12 HEAD)"
          IOS_DIR="$CM_BUILD_DIR/apps/mobile-tv/ios"
          WORKSPACE="$(find "$IOS_DIR" -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"

          PROJECT="$(find "$IOS_DIR" -maxdepth 1 -type d -name '*.xcodeproj' ! -name 'Pods.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          SCHEME_FILE="$(find "$PROJECT/xcshareddata/xcschemes" -maxdepth 1 -type f -name '*.xcscheme' -print -quit)"
          test -n "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          test -n "$SCHEME"

          DERIVED="$CM_BUILD_DIR/artifacts/tvos-derived"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP="$(find "$DERIVED/Build/Products/Release-appletvos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"

          mkdir -p artifacts/tvos
          bash scripts/package-ios-resignable.sh \
            "$APP" \
            artifacts/tvos/MoviesTv-Flix-tvos-resignable-preview.ipa
          bash scripts/verify-tvos-resignable.sh \
            artifacts/tvos/MoviesTv-Flix-tvos-resignable-preview.ipa \
            "$(git rev-parse --short=12 HEAD)"
          (
            cd artifacts/tvos
            shasum -a 256 MoviesTv-Flix-tvos-resignable-preview.ipa > MoviesTv-Flix-tvos-resignable-preview.ipa.sha256
          )

    artifacts:
      - artifacts/tvos/MoviesTv-Flix-tvos-resignable-preview.ipa
      - artifacts/tvos/MoviesTv-Flix-tvos-resignable-preview.ipa.sha256
      - /tmp/xcodebuild_logs/*.log
