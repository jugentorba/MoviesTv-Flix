<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>MoviesTv-Flix Updates</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #09090b; color: #f7f7f8; }
    main { width: min(900px, 92vw); margin: 0 auto; padding: 48px 0 72px; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 52px); letter-spacing: -0.04em; }
    .lead { color: #a1a1aa; line-height: 1.6; margin: 10px 0 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { border: 1px solid #27272a; border-radius: 18px; background: #141416; padding: 18px; }
    .platform { color: #a1a1aa; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; }
    .version { font-size: 22px; font-weight: 900; margin: 7px 0 4px; }
    .notes { color: #a1a1aa; font-size: 13px; line-height: 1.5; min-height: 40px; }
    .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 14px; padding: 0 16px; border-radius: 11px; background: #fff; color: #09090b; text-decoration: none; font-weight: 900; }
    .muted { color: #71717a; font-size: 12px; margin-top: 14px; }
    #status { color: #a1a1aa; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>MoviesTv-Flix updates</h1>
    <p class="lead">Official preview downloads for phone and TV. Android packages use the same application ID and trusted signing certificate so compatible updates install over the existing app.</p>
    <p id="status">Checking the latest release…</p>
    <section class="grid" id="releases" hidden></section>
  </main>
  <script>
    const platforms = [
      ['android', 'Android phone', 'APK'],
      ['androidTv', 'Android TV', 'APK'],
      ['ios', 'iPhone / iPad', 'IPA'],
      ['tvos', 'Apple TV', 'IPA'],
    ];

    const safe = (value) => typeof value === 'string' ? value : '';

    function releaseCard(key, label, fileType, entry) {
      const card = document.createElement('article');
      card.className = 'card';

      const platform = document.createElement('div');
      platform.className = 'platform';
      platform.textContent = label;
      card.appendChild(platform);

      const version = document.createElement('div');
      version.className = 'version';
      version.textContent = entry
        ? `${safe(entry.version) || 'Preview'} · build ${Number.isInteger(entry.build) ? entry.build : '—'}`
        : 'Not published';
      card.appendChild(version);

      const notes = document.createElement('div');
      notes.className = 'notes';
      notes.textContent = safe(entry?.releaseNotes) || 'No release notes.';
      card.appendChild(notes);

      if (entry?.downloadUrl && /^https:\/\//i.test(entry.downloadUrl)) {
        const link = document.createElement('a');
        link.className = 'button';
        link.href = entry.downloadUrl;
        link.rel = 'noopener noreferrer';
        link.textContent = `Download ${fileType}`;
        card.appendChild(link);
      } else {
        const pending = document.createElement('div');
        pending.className = 'muted';
        pending.textContent = 'The package file has not been published yet.';
        card.appendChild(pending);
      }

      return card;
    }

    async function load() {
      const status = document.getElementById('status');
      const releases = document.getElementById('releases');
      try {
        const response = await fetch('/api/app-update/manifest', { cache: 'no-store' });
        if (!response.ok) throw new Error('release manifest unavailable');
        const manifest = await response.json();
        releases.replaceChildren(
          ...platforms.map(([key, label, fileType]) => (
            releaseCard(key, label, fileType, manifest[key])
          )),
        );
        releases.hidden = false;
        status.textContent = `Channel: ${safe(manifest.channel) || 'preview'}`;
      } catch {
        status.textContent = 'The release service is temporarily unavailable.';
      }
    }

    void load();
  </script>
</body>
</html>
